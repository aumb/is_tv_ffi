name: is_tv_ffi
description: "A Flutter plugin to detect if the current device is a TV"
version: 0.7.0
homepage: https://github.com/aumb/is_tv_ffi
repository: https://github.com/aumb/is_tv_ffi
issue_tracker: https://github.com/aumb/is_tv_ffi/issues
topics:
  - tv
  - ffi

environment:
  sdk: ^3.8.1
  flutter: ">=3.35.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  jni: ^1.0.0
  jni_flutter: ^1.0.1
  mocktail: ^1.0.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  jnigen: ^0.16.0
  ffigen: ^20.1.1

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: IsTvFfiWebPlugin
        fileName: src/platforms/web/bindings.dart
