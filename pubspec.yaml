name: is_tv_ffi
description: >-
  Detects whether a Flutter app is running on a TV: Android TV, tvOS, webOS,
  Tizen and TV-mode Linux and Windows, using FFI and JNI rather than platform
  channels.
version: 0.7.1
homepage: https://github.com/aumb/is_tv_ffi
repository: https://github.com/aumb/is_tv_ffi
issue_tracker: https://github.com/aumb/is_tv_ffi/issues
topics:
  - tv
  - ffi
  - android-tv
  - tvos
  - smart-tv

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  jni: ^1.0.0
  jni_flutter: ^1.0.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  jnigen: ^0.16.0
  ffigen: ^20.1.1

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: IsTvFfiWebPlugin
        fileName: src/platforms/web/bindings.dart
