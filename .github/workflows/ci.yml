name: Flutter Plugin CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  analyze:
    name: Format, Analyze & Publish Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Get example dependencies
        run: flutter pub get
        working-directory: example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run analyzer
        run: flutter analyze

      - name: Run analyzer on the example
        run: flutter analyze
        working-directory: example

      - name: Check the package can be published
        run: flutter pub publish --dry-run

  dart_tests:
    name: Dart Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run platform unit tests
        run: flutter test -r expanded test/entry_points/platforms_tests.dart

      - name: Run web unit tests
        run: flutter test -r expanded --platform chrome test/entry_points/web_tests.dart

      - name: Run example widget tests
        run: flutter test -r expanded
        working-directory: example

  android_tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Pinned to v5 on purpose. v6 moves the caching functionality into
      # `gradle-actions-caching`, a proprietary component that is not MIT
      # licensed, and upgrading constitutes accepting Gradle's Terms of Use.
      # https://blog.gradle.org/github-actions-for-gradle-v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Get example dependencies
        run: flutter pub get
        working-directory: example

      # example/android/settings.gradle.kts reads flutter.sdk from
      # local.properties, which is generated locally and not checked in.
      - name: Point Gradle at the Flutter SDK
        run: echo "flutter.sdk=${FLUTTER_ROOT:-$(dirname "$(dirname "$(which flutter)")")}" >> local.properties
        working-directory: example/android

      # The plugin no longer applies the Kotlin Gradle Plugin, so its Gradle
      # project cannot be built on its own: Flutter supplies Kotlin, which means
      # the tests have to run through the example app.
      - name: Run Kotlin unit tests
        run: ./gradlew :is_tv_ffi:test
        working-directory: example/android

  linux_native_tests:
    name: Linux Native Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build the example
        run: flutter build linux --debug
        working-directory: example

      - name: Run the gtest suite
        run: |
          test_binary="$(find example/build/linux -type f -name is_tv_ffi_test | head -n 1)"
          if [ -z "$test_binary" ]; then
            echo "::error::is_tv_ffi_test was not built"
            exit 1
          fi
          "$test_binary"

  windows_native_tests:
    name: Windows Native Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build the example
        run: flutter build windows --debug
        working-directory: example

      - name: Run the gtest suite
        shell: pwsh
        run: |
          $testBinary = Get-ChildItem -Path example/build/windows -Recurse -Filter is_tv_ffi_test.exe |
            Select-Object -First 1
          if (-not $testBinary) {
            Write-Output "::error::is_tv_ffi_test.exe was not built"
            exit 1
          }
          & $testBinary.FullName
