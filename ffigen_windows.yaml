name: IsTvFfiWindowsPlugin
description: Bindings for Windows isTv check.
output: "lib/src/platforms/windows/bindings.dart"
headers:
  entry-points:
    - "windows/is_tv_windows.h"
# The is_tv_windows.h header includes <stdbool.h>, which otherwise emits junk
# constants (__bool_true_false_are_defined, true, false). We bind no macros.
macros:
  exclude:
    - ".*"
preamble: |
  // ignore_for_file: camel_case_types, non_constant_identifier_names, unused_element, unused_field
